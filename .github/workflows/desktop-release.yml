name: Personal macOS M4 Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-arm64:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ONNXRUNTIME_NODE_INSTALL: skip
      PASEO_DESKTOP_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: getpaseo/paseo
          ref: 18c002cbf2d8d090f965fc9fd8fd858ee7b52295
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: Build macOS ARM64 desktop app and run packaged smoke checks
        env:
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: npm run build:desktop -- --publish never --mac --arm64 -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false
      - name: Verify architecture and ad-hoc signature
        run: |
          app=packages/desktop/release/mac-arm64/Paseo.app
          test "$(lipo -archs "$app/Contents/MacOS/Paseo")" = arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist"
          node -e 'const fs=require("node:fs");fs.writeFileSync("packages/desktop/release/BUILD.json",JSON.stringify({version:require("./package.json").version,commit:"18c002cbf2d8d090f965fc9fd8fd858ee7b52295",platform:"darwin-arm64",signing:"ad-hoc",notarized:false,packagedSmoke:"passed"},null,2)+"\n")'
          cd packages/desktop/release
          shasum -a 256 *.dmg *.zip > SHA256SUMS
      - name: Upload macOS app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paseo-macos-arm64-18c002cbf
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/BUILD.json
            packages/desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paseo-macos-arm64-smoke-18c002cbf
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7
